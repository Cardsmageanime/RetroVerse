name: RetroVerse ARM64 Minimal Root Filesystem
on:
  workflow_dispatch:
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/build-arm64-rootfs.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem creation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static e2fsprogs rsync
      - name: Build ARM64 Debian root filesystem
        run: sudo bash rootfs/build-minimal-arm64.sh "$RUNNER_TEMP/retroverse-rootfs"
      - name: Verify rootfs and package archive
        run: |
          sudo bash rootfs/validate-minimal-arm64.sh "$RUNNER_TEMP/retroverse-rootfs"
          sudo tar --numeric-owner -C "$RUNNER_TEMP/retroverse-rootfs" -czf retroverse-arm64-rootfs.tar.gz .
          sha256sum retroverse-arm64-rootfs.tar.gz > SHA256SUMS
      - name: Upload rootfs artifact (not bootable)
        uses: actions/upload-artifact@v4
        with:
          name: retroverse-arm64-MINIMAL-ROOTFS-NOT-BOOTABLE
          path: |
            retroverse-arm64-rootfs.tar.gz
            SHA256SUMS
          if-no-files-found: error

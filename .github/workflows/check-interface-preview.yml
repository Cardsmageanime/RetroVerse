name: RetroVerse Interface Preview Checks
on:
  push:
    paths:
      - 'interface/preview/**'
      - 'tests/test_interface_preview.py'
      - 'tests/test_gamepad.js'
      - 'tests/test_controller_detection.js'
      - '.github/workflows/check-interface-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check interface/preview/app.js
      - run: node --check interface/preview/gamepad.js
      - run: node tests/test_gamepad.js
      - run: node --check interface/preview/controller-detection.js
      - run: node tests/test_controller_detection.js
      - run: python3 -m unittest discover -s tests -p 'test_interface_preview.py' -v

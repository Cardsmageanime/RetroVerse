name: Check Online and ARM UI Foundations

on:
  push:
    paths:
      - 'online/server/**'
      - 'online/gameplay/**'
      - 'boot/tools/launch_neon_arm.sh'
      - '.github/workflows/check-online-arm-foundation.yml'
  pull_request:
    paths:
      - 'online/server/**'
      - 'online/gameplay/**'
      - 'boot/tools/launch_neon_arm.sh'
      - '.github/workflows/check-online-arm-foundation.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate launcher shell syntax
        run: sh -n boot/tools/launch_neon_arm.sh
      - name: Test lobby and chat protocol
        run: python -m unittest discover -s online/server -p 'test_*.py' -v
      - name: Byte-compile gameplay server
        run: python -m py_compile online/server/lobby_server.py online/gameplay/pong_server.py online/gameplay/pong_engine.py
      - name: Verify gameplay mechanics
        run: python -m unittest discover -s online/gameplay -p 'test_*.py' -v

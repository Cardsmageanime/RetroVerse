<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroVerse Systems Edition — Title Screen</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#e8f7ff;background:#04051d}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 51% 73%,#ff56a56e 0%,transparent 31%),radial-gradient(ellipse at 50% 42%,#7729b7b0,transparent 56%),linear-gradient(#030a30 0%,#171157 53%,#7c165f 72%,#080528 100%)}body:before{content:'';pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 15%,#d9f1ff,transparent),radial-gradient(2px 2px at 55% 12%,#da75ff,transparent),radial-gradient(1px 1px at 85% 37%,#d9efff,transparent),radial-gradient(1px 1px at 43% 33%,#fcf4ff,transparent);background-size:190px 170px,310px 240px,255px 155px,440px 310px;opacity:.76}.world{position:absolute;top:14%;left:50%;width:min(43vw,420px);aspect-ratio:1;border-radius:50%;transform:translateX(-50%);border:2px solid #a74eff;box-shadow:0 0 70px #a545ff,0 0 140px #3aa4ff55;opacity:.47;background:radial-gradient(circle at 30% 22%,#4bafff,#36329e 45%,#110b4e 75%)}.world:after{content:'';position:absolute;inset:20% -30%;border:6px solid #ff6afa;border-radius:50%;transform:rotate(-23deg);filter:drop-shadow(0 0 12px #dc56ff)}.grid{position:fixed;inset:70% 0 0;transform:perspective(330px) rotateX(45deg) scale(1.7);transform-origin:top;background:linear-gradient(#3b7cff8a 1px,transparent 1px),linear-gradient(90deg,#bd43ff8a 1px,transparent 1px);background-size:65px 40px;mask-image:linear-gradient(transparent,#000 50%);pointer-events:none}.shell{position:relative;z-index:1;max-width:1500px;min-height:100vh;padding:30px 4vw 22px;margin:auto;display:flex;flex-direction:column;justify-content:space-between}.topbar{display:flex;justify-content:space-between;gap:20px;font-size:13px;letter-spacing:2px;color:#a5ccff}.topbar .online{letter-spacing:0}.brand{text-align:center;margin:auto 0 18vh;text-shadow:0 0 24px #447bff}.brand h1{font-weight:1000;letter-spacing:-.06em;font-size:clamp(55px,10vw,150px);font-style:italic;line-height:1;margin:0;background:linear-gradient(100deg,#19e8ff,#76baff 39%,#fa6aff 70%,#ec3ce8);color:transparent;background-clip:text;filter:drop-shadow(0 2px 5px #326dfd)}.brand h2{font-weight:400;letter-spacing:.8em;font-size:clamp(12px,2.2vw,29px);margin:8px 0}.brand p{letter-spacing:.5em;font-size:clamp(10px,1vw,16px);margin-top:28px}.menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.tile{min-height:156px;padding:17px 7px;border:2px solid var(--tile);border-radius:14px;background:#06152ad9;color:white;box-shadow:0 0 24px color-mix(in srgb,var(--tile),transparent 55%),inset 0 0 20px color-mix(in srgb,var(--tile),transparent 80%);cursor:pointer;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:10px;text-align:center;text-decoration:none}.tile .ico{font-size:40px;line-height:1}.tile strong{font-size:clamp(13px,1.4vw,19px)}.tile small{font-size:12px;color:#aac5eb}.tile:hover,.tile:focus-visible,.tile.selected{transform:translateY(-7px);box-shadow:0 0 30px var(--tile);outline:none}.action{display:flex;justify-content:center;margin:20px 0}.action button{font:inherit;font-weight:750;letter-spacing:2px;border-radius:40px;padding:14px 54px;background:#071b4ee8;color:#e0f4ff;border:2px solid #77c8ff;box-shadow:0 0 18px #3f8aff;cursor:pointer}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#b9d9ff;font-size:12px;letter-spacing:1px}.message{position:fixed;z-index:3;left:50%;bottom:10%;transform:translateX(-50%);border:1px solid #8ad9ff;background:#06152af5;padding:12px 20px;border-radius:8px;max-width:90vw;display:none}.message.show{display:block}@media(max-width:850px){.brand{margin:12vh 0 7vh}.brand h1{font-size:clamp(42px,12vw,90px)}.menu{grid-template-columns:repeat(2,1fr)}.tile{min-height:118px}.tile:nth-child(3){grid-column:span 2}.world{top:16%;width:70vw}.brand h2{letter-spacing:.35em}.brand p{letter-spacing:.16em}.shell{min-height:100svh}}@media(prefers-reduced-motion:reduce){.tile:hover </style></head><body><div class="world" aria-hidden="true"></div><div class="grid" aria-hidden="true"></div><main class="shell"><header class="topbar"><span>GAMES<br>SYSTEMS<br>GOOD TIMES<br>FOREVER</span><span class="online">◉ RetroVerse Systems Edition · UI prototype</span></header><section class="brand"><h1>RETROVERSE</h1><h2>SYSTEMS EDITION</h2><p>ALL GENERATIONS. ONE UNIVERSE.</p></section><section aria-label="Start menu"><div class="menu" id="menu"><button class="tile" style="--tile:#2cbfff" data-action="signin"><span class="ico">◉</span><strong>SIGN IN</strong><small>Your Profile · Your Games</small></button><button class="tile" style="--tile:#b14dff" data-action="offline"><span class="ico">◇</span><strong>OFFLINE MODE</strong><small>Play without signing in</small></button><button class="tile selected" style="--tile:#29cfff" data-action="start"><span class="ico">🎮</span><strong>START</strong><small>Continue to RetroVerse</small></button><button class="tile" style="--tile:#ec59eb" data-action="settings"><span class="ico">⚙</span><strong>SETTINGS</strong><small>Configure your experience</small></button><button class="tile" style="--tile:#14dfc7" data-action="wifi"><span class="ico">◉</span><strong>WI-FI</strong><small>Network status</small></button></div><div class="action"><button id="press-start" type="button">Ⓐ &nbsp; PRESS START</button></div></section><footer class="bottom"><span>Ⓐ SELECT &nbsp; Ⓑ BACK &nbsp; D-PAD NAVIGATE</span><span>LIBRARY &nbsp;│&nbsp; SYSTEMS &nbsp;│&nbsp; ONLINE &nbsp;│&nbsp; SETTINGS</span></footer></main><div id="message" class="message" role="status"></div><script>
(()=>{'use strict';const tiles=[...document.querySelectorAll('.tile')],message=document.getElementById('message');let selected=2,previous=[];function focus(i){selected=(i+tiles.length)%tiles.length;tiles.forEach((el,j)=>el.classList.toggle('selected',i===j));tiles[selected].focus()}function tell(s){message.textContent=s;message.classList.add('show');window.setTimeout(()=>message.classList.remove('show'),3800)}function activate(i=selected){const action=tiles[i].dataset.action;if(action==='start'||action==='offline'){try{sessionStorage.setItem('retroverse_launch_mode',action)}catch(_e){}location.href='../neon-showcase/index.html';return}if(action==='signin')tell('RetroVerse Online account login is planned; no authentication is available in this preview.');if(action==='wifi')tell('Network setup requires integration with the operating system.');if(action==='settings')location.href='../neon-showcase/index.html#settings'}tiles.forEach((el,i)=>{el.addEventListener('focus',()=>{selected=i;tiles.forEach((t,j)=>t.classList.toggle('selected',i===j))});el.addEventListener('click',()=>activate(i))});document.getElementById('press-start').addEventListener('click',()=>activate());document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();focus(selected+(['ArrowLeft','ArrowUp'].includes(e.key)?-1:1))}if(e.key==='Enter'&&document.activeElement===document.body){e.preventDefault();activate()}if(e.key==='Escape')tell('Press Start or choose a menu item.')});function poll(){const pads=navigator.getGamepads?.()||[];let pressed=[];for(const pad of pads)if(pad){const b=pad.buttons||[],axis=pad.axes||[];if(b[0]?.pressed)pressed.push('select');if(b[12]?.pressed||axis[1]<-.6)pressed.push('prev');if(b[13]?.pressed||axis[1]>.6)pressed.push('next')}for(const key of pressed)if(!previous.includes(key)){if(key==='select')activate();else focus(selected+(key==='next'?1:-1))}previous=pressed;requestAnimationFrame(poll)}requestAnimationFrame(poll)})();
</script></body></html>

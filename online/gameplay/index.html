<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroVerse Live Gameplay Test</title><style>body{background:radial-gradient(circle at 70% 20%,#31146d,#080e26 65%);color:#e4faff;font:16px system-ui;margin:0;padding:22px;text-align:center}h1{color:#4bddff;text-shadow:0 0 20px #2a9fff}canvas{background:#07152a;border:2px solid #3dd9ff;max-width:96vw;width:800px;height:auto;box-shadow:0 0 35px #188bff66}button{border:1px solid #35c9ff;border-radius:8px;background:#163f7c;color:white;padding:11px 20px;cursor:pointer}button:focus-visible{outline:3px solid white}.hint{color:#9eb8e4}#status{min-height:1.5em}</style></head><body><h1>RETROVERSE // LIVE GAMEPLAY TEST</h1><p>Two-player experimental server-authoritative Pong · Local machine only</p><p><button id="connect">Connect to Game</button> <span id="status" role="status">Disconnected</span></p><canvas width="800" height="450" aria-label="RetroVerse Pong game field"></canvas><p class="hint">Use ↑ / ↓ or W / S to move your paddle. Open this page twice to join as two players.</p><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),connect=document.querySelector('#connect');let socket=null,player=null,state=null,direction=0;function draw(){ctx.fillStyle='#07152a';ctx.fillRect(0,0,800,450);ctx.strokeStyle='#224c89';ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,450);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#3de5ff';if(state){state.paddles.forEach((y,i)=>ctx.fillRect(i===0?31:755,y-40,14,80));ctx.fillStyle='#ff66dd';ctx.fillRect(state.ball[0]-6,state.ball[1]-6,12,12);ctx.fillStyle='#fff';ctx.font='28px system-ui';ctx.fillText(state.scores.join('       '),353,45)}else{ctx.fillStyle='#d4e7ff';ctx.font='20px system-ui';ctx.fillText('Connect and invite a second player',226,215)}requestAnimationFrame(draw)}draw();function send(){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'input',direction}))}function key(e,pressed){const up=['ArrowUp','w','W'].includes(e.key),down=['ArrowDown','s','S'].includes(e.key);if(!up&&!down)return;e.preventDefault();direction=pressed?(up?-1:1):0;send()}document.addEventListener('keydown',e=>key(e,true));document.addEventListener('keyup',e=>key(e,false));connect.addEventListener('click',()=>{if(socket&&socket.readyState===WebSocket.OPEN)return;socket=new WebSocket('ws://127.0.0.1:8767');status.textContent='Connecting…';socket.onopen=()=>status.textContent='Connected — waiting for second player';socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){player=m.player;status.textContent='Player '+(player+1)+' — waiting for opponent'}else if(m.type==='players'){status.textContent=m.count===2?'Match active — player '+(player+1):'Waiting for second player'}else if(m.type==='state'){state=m}else if(m.type==='reset'){state=null;status.textContent=m.reason}else if(m.type==='error'){status.textContent=m.message}};socket.onclose=()=>{state=null;status.textContent='Disconnected — restart to reconnect'};socket.onerror=()=>status.textContent='Server unavailable — start pong_server.py first'})})();
</script></body></html>
